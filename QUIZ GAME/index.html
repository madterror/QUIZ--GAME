<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #quiz-container{
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            border:2px solid gray;
            padding: 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 20px;

        }
        .btn{
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            background: whitesmoke;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 15px;
        }
        .correct{
            background-color: lightgreen;
        }
        .incorrect{
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <div id="quiz-container">
        <h2 id="question">Quiz Questions</h2>
        <div id="answers"></div>
        <button id="btn" class="btn">Next</button>
    </div>

    <script>
        const questions = [
    {
        question: "Which keyword declares a constant in JavaScript?",
        answers: [
            { text: "Let", correct: false },
            { text: "var", correct: false },
            { text: "const", correct: true },
            { text: "string", correct: false }
        ]
    },

    {
        question: "Which keyword is used to declare a variable in JavaScript?",
        answers: [
            { text: "variable", correct: false },
            { text: "let", correct: true },
            { text: "define", correct: false },
            { text: "int", correct: false }
        ]
    },

    {
        question: "Which symbol is used for single-line comments in JavaScript?",
        answers: [
            { text: "//", correct: true },
            { text: "/* */", correct: false },
            { text: "#", correct: false },
            { text: "<!-- -->", correct: false }
        ]
    },

    {
        question: "Which data type is used to store text in JavaScript?",
        answers: [
            { text: "Number", correct: false },
            { text: "Boolean", correct: false },
            { text: "String", correct: true },
            { text: "Object", correct: false }
        ]
    },

    {
        question: "Which method is used to print output in the browser console?",
        answers: [
            { text: "print()", correct: false },
            { text: "console.log()", correct: true },
            { text: "display()", correct: false },
            { text: "write()", correct: false }
        ]
    },

    {
        question: "Which operator is used to compare both value and data type?",
        answers: [
            { text: "=", correct: false },
            { text: "==", correct: false },
            { text: "===", correct: true },
            { text: "!=", correct: false }
        ]
    },

    {
        question: "Which method is used to add an element to the end of an array?",
        answers: [
            { text: "pop()", correct: false },
            { text: "push()", correct: true },
            { text: "shift()", correct: false },
            { text: "add()", correct: false }
        ]
    },

    {
        question: "Which statement is used to make a decision in JavaScript?",
        answers: [
            { text: "if", correct: true },
            { text: "loop", correct: false },
            { text: "repeat", correct: false },
            { text: "check", correct: false }
        ]
    },

    {
        question: "Which function converts a JSON string into a JavaScript object?",
        answers: [
            { text: "JSON.stringify()", correct: false },
            { text: "JSON.parse()", correct: true },
            { text: "JSON.convert()", correct: false },
            { text: "JSON.object()", correct: false }
        ]
    },

    {
        question: "Which keyword is used to create a function that can be awaited?",
        answers: [
            { text: "wait", correct: false },
            { text: "async", correct: true },
            { text: "promise", correct: false },
            { text: "awaiting", correct: false }
        ]
    }
];
        const questionElement = document.getElementById("question");
        const answersElement = document.getElementById("answers");
        const nextButton = document.getElementById("btn");

        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz(){
            nextButton.disabled = true;
            nextButton.removeEventListener("click",startQuiz)
            currentQuestionIndex = 0;
            score = 0;
            nextButton.disabled=true
            nextButton.textContent = "Next";
            showQuestion();
        }
        function showQuestion(){
            const currentQuestion = questions[currentQuestionIndex];
            questionElement.textContent= currentQuestion.question;
            currentQuestion.answers.forEach((ans) =>{
                const button = document.createElement("button")
                button.textContent = ans.text;
                button.classList.add("btn")
                answersElement.appendChild(button)
                if(ans.correct){
                    button.dataset.correct = ans.correct;

                }
                button.addEventListener("click" ,selectAnswers)

            })
        }
        function selectAnswers(e){
            const selectedBtn = e.target;
            const selecetedisCorrect = selectedBtn.dataset.correct === "true"
            if(selecetedisCorrect){
                score++;

            }
           Array.from(answersElement.children).forEach(btn =>{
            const isCorrect = btn.dataset.correct;
            if(isCorrect){
                btn.classList.add("correct");
               

            }else{
                btn.classList.add("incorrect");
            }
            btn.disabled = true;
           })
           console.log(score)
           nextButton.disabled=false;
        }

        nextButton.addEventListener('click',()=>{
            currentQuestionIndex++;
            resetState();
            if(currentQuestionIndex < questions.length){
                showQuestion();
            }else{
                showScore(); 
            }
        })

        function showScore(){

             
            questionElement.textContent = `you Scored ${score} out of ${questions.length}`
            nextButton.disabled = false;
            nextButton.textContent= "Play Again"
            nextButton.addEventListener("click" , startQuiz);
        
        }
        function resetState(){
            nextButton.disabled = true;
            while(answersElement.firstChild){
                answersElement.removeChild(answersElement.firstChild);
            }
        }
        
        startQuiz();

        


          
         
    </script>
    
</body>
</html>
